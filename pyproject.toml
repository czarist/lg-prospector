[project]
name = "lg-prospector"
version = "0.1.0"
description = "Plataforma SaaS de prospecção B2B com LangGraph e EspoCRM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.29",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "aiosmtplib>=3.0.2",
    "playwright>=1.49.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
lg-prospector = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
